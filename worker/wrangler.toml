name = "rhydive-mirror"
main = "src/index.ts"
compatibility_date = "2024-11-01"
workers_dev = true

# Chart archives + extracted assets. ~9 GB for the full library in the default
# "all" asset mode; see docs/ARCHITECTURE.md for the storage budget.
[[r2_buckets]]
binding = "MIRROR"
bucket_name = "rhydive-mirror"

# How often the incremental sync runs. Each tick drains a bounded number of
# songs, so a short interval converges faster without hammering the origin.
[triggers]
crons = ["*/20 * * * *"]

[vars]
OFFICIAL_ORIGIN = "https://sta.lunprin.com"
OFFICIAL_CDN_ORIGIN = "https://dl.lunprin.com"
# Where the sync reads official artifacts from.
#   api = sta.lunprin.com           (canonical, valid SSL certificate)
#   cdn = dl.lunprin.com/rhydive/beatmap (Tencent CDN; automatically falls back to API on 526/522)
SYNC_SOURCE = "api"
# How to reconcile the catalog's archiveHash with the archive the origin really
# serves. Re-uploaded songs keep the hash they were first published with, so the
# two disagree until the official catalog is refreshed.
#   manifest = publish with the real hash (default)   strict = withhold instead
SYNC_HASH_MODE = "manifest"
# Storage layout: "r2" (default), "gdrive" (all bulk in Drive), or "hybrid" (R2 hot + Drive bulk)
STORAGE_LAYOUT = "hybrid"
# Pinned Google Drive folder ID (clean single folder in your Drive)
GDRIVE_FOLDER_ID = "1K7xD0NQn0gG0l2RrJwKB7voCpV4ys65Q"
# Resumable chunk size in MB (OpenList defaults to 5 MB; must be multiple of 256 KB)
GDRIVE_CHUNK_SIZE_MB = "5"
# all | hot | lazy
SYNC_ASSET_MODE = "hot"
SYNC_MAX_SONGS_PER_TICK = "3"
SYNC_BUDGET_MS = "20000"
MIRROR_FALLBACK_PROXY = "true"
ASSET_WRITE_THROUGH = "true"
# MIRROR_API_PREFIX = "/api/rhydive"

[observability]
enabled = true

# SYNC_TOKEN is a secret; set it with:
#   npx wrangler secret put SYNC_TOKEN
